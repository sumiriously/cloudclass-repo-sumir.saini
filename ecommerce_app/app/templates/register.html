{% extends "base.html" %}
{% block content %}
  <div class="auth-card panel">
    <span class="eyebrow">Join the shop</span>
    <h2>Create Tiki Surf Shop Account</h2>
    <form method="post" action="{{ url_for('web.ui_register') }}">
      <label>Email</label>
      <input type="email" name="email" value="{{ email or '' }}" required />
      <label>Password (min 8 chars)</label>
      <input type="password" name="password" required />
      <button class="primary" type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('web.ui_login') }}">Sign in</a></p>
  </div>
{% endblock %}
